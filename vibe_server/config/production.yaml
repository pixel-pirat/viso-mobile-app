# This is the configuration file for your production environment.
# Typically, you will want to route the traffic through a load balancer
# which adds SSL security through https. If you use Serverpod's standard
# Terraform scripts to deploy your server, all you need to change in
# this file is the examplepod.com domain name.

# Configuration for the main API server.
# NOTE: the actual bind port is overridden at runtime by the
# SERVERPOD_API_SERVER_PORT env var (set from Render's $PORT in the
# Dockerfile ENTRYPOINT), since Render assigns the port dynamically.
apiServer:
  port: 8080
  publicHost: viso-mobile-app.onrender.com
  publicPort: 443
  publicScheme: https

# Insights/web aren't exposed publicly by the single Render web service (only
# one port is routed), so these are unused placeholders for now.
insightsServer:
  port: 8081
  publicHost: viso-mobile-app.onrender.com
  publicPort: 443
  publicScheme: https

webServer:
  port: 8082
  publicHost: viso-mobile-app.onrender.com
  publicPort: 443
  publicScheme: https

# Points at the same Neon Postgres branch used for local development. Create a
# separate Neon branch later if you want to isolate production data from dev.
database:
  host: ep-dark-water-b55jrppm.c-7.us-east-2.aws.neon.tech
  port: 5432
  name: neondb
  user: neondb_owner
  requireSsl: true
  #isUnixSocket: true # defaults to false
  #maxConnectionCount: 10 # Defaults to 10, a negative or null value removes the limit

redis:
  enabled: false
  host: redis.private-production.examplepod.com
  port: 6379
  #user: # defaults to empty
  #requireSsl: true # defaults to false

maxRequestSize: 15728640 # 15 MB, to allow profile picture/post media uploads

# consoleEnabled is on so verification codes and errors are visible in
# Render's live log stream (Dashboard > your service > Logs), since there's
# no real email service wired up yet.
sessionLogs:
  consoleEnabled: true
# persistentEnabled: true
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000

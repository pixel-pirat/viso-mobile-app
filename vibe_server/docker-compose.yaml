services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vibe
      POSTGRES_PASSWORD: "HkkNtZhu-JT3VoDR5iX3dfuDNyZjW9zq"
    volumes:
      - vibe_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "0r6BVDn3O4F-MeqWdTbRUELwFnaLnEDc"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vibe_test
      POSTGRES_PASSWORD: "dyvjFAe42kaP5lzTcWseDodxEJ3NnguQ"
    volumes:
      - vibe_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "3u6TfZBKWE0499cJNDOdB8zU-E2TT-v6"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  vibe_data:
  vibe_test_data:
